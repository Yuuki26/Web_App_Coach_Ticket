# "h2" profile: run without MySQL, using a database held in memory (data is lost on restart).
# Start with:  mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=h2
spring.datasource.url=jdbc:h2:mem:busdb
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Without a TomTom or Google key, local development gets made-up traffic marked "source": "SIMULATED".
app.traffic.without-key=simulated
