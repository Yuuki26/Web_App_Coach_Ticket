spring.application.name=bus-ticket-booking
# Settings and keys can also be kept in a .env file next to pom.xml (KEY=value lines, see .env.example).
# .env is ignored by git, so keys put there are never committed.
spring.config.import=optional:file:.env[.properties]
server.port=8081

# MySQL. The database "hcoach" is created automatically on first start.
# Set the DB_USER and DB_PASSWORD environment variables instead of writing a password in this file.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hcoach?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
# Creates and updates tables from the entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Login tokens. JWT_SECRET must be 32+ characters; if unset, a random key is used (dev only).
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=7d

# Accounts. The verification token is appended to verify-email-url; the frontend page at that
# address reads it and calls POST /api/v1/auth/verify-email. Until real email is set up the link
# is written to the log.
app.auth.require-email-verification=true
app.auth.verification-ttl=24h
app.auth.verify-email-url=${APP_PUBLIC_URL:http://localhost:8081}/verify-email?token=

# Allowed frontend origins (comma-separated)
# 5500 = VS Code Live Server, used for the frontend in ../frontend/hcoach
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500}

# One verified test account per role (admin@test.com, manager@, driver@, customer@ – see README)
app.seed.demo-users=true

# Sample trips are kept generated this many days ahead (checked on every start)
app.seed.days=14

# Live traffic on routes, from TomTom (TOMTOM_API_KEY) or Google Maps (GOOGLE_MAPS_API_KEY, Routes API).
# Keys stay on the server and are never sent to browsers. provider: auto (Google if its key is set, else
# TomTom if its key is set, else without-key), google, tomtom, simulated (made-up numbers) or off.
app.traffic.provider=${TRAFFIC_PROVIDER:auto}
app.traffic.without-key=off
app.traffic.google-api-key=${GOOGLE_MAPS_API_KEY:}
app.traffic.tomtom-api-key=${TOMTOM_API_KEY:}
# One answer per route is reused this long, and Google is asked at most daily-limit times a day
# (about 4,800 a month). After that the last answer is shown, marked stale.
app.traffic.cache-ttl=5m
app.traffic.daily-limit=160
app.traffic.timeout=5s
# Google only: per-stretch speeds for colouring the route line (Google may bill these at a higher rate).
# TomTom always includes them.
app.traffic.speed-intervals=false
# Arrival estimates from live traffic are given for trips leaving within this time
app.traffic.trip-window=3h
