spring.application.name=bus-ticket-booking
server.port=8081

# MySQL. The database "hcoach" is created automatically on first start.
# Set the DB_USER and DB_PASSWORD environment variables instead of writing a password in this file.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hcoach?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
# Creates and updates tables from the entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Login tokens. JWT_SECRET must be 32+ characters; if unset, a random key is used (dev only).
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=7d

# Accounts. The verification token is appended to verify-email-url; the frontend page at that
# address reads it and calls POST /api/v1/auth/verify-email. Until real email is set up the link
# is written to the log.
app.auth.require-email-verification=true
app.auth.verification-ttl=24h
app.auth.verify-email-url=${APP_PUBLIC_URL:http://localhost:8081}/verify-email?token=

# Allowed frontend origins (comma-separated)
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# One verified test account per role (admin@test.com, manager@, driver@, customer@ – see README)
app.seed.demo-users=true

# Sample trips are kept generated this many days ahead (checked on every start)
app.seed.days=14
