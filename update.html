<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>H Coach Vietnam — Intercity Bus & Limousine Ticket Booking</title>
  <meta name="description" content="Book intercity bus and VIP limousine tickets across all 63 provinces of Vietnam with H Coach. Real-time seat maps, secure payments, and instant QR e-tickets." />

  <!-- Optional Google Font (gracefully falls back to system fonts offline) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    /* =========================================================================
     * 1. DESIGN TOKENS & RESET
     * ========================================================================= */
    :root {
      --navy: #0F4C81;
      --navy-dark: #0A3A64;
      --navy-soft: #EBF1F9;
      --orange: #FF7A1A;
      --orange-hover: #EA6A0E;
      --orange-soft: #FFF4EB;
      --bg: #F6F8FB;
      --card: #FFFFFF;
      --ink: #1B2430;
      --muted: #6B7785;
      --border: #E2E8F0;
      --success: #059669;
      --success-soft: #ECFDF5;
      --danger: #DC2626;
      --danger-soft: #FEF2F2;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --shadow-sm: 0 1px 3px rgba(15, 76, 129, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 6px 20px rgba(15, 76, 129, 0.08);
      --shadow-lg: 0 14px 32px rgba(15, 76, 129, 0.14);
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      font-size: 16px;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg);
      color: var(--ink);
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
    }

    button, input, select {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: transparent;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    svg {
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
    }

    /* =========================================================================
     * 2. LAYOUT & COMMON COMPONENTS
     * ========================================================================= */
    #app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
    }

    .container {
      width: 100%;
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 16px;
    }

    .container-md {
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      padding: 0 16px;
    }

    @media (min-width: 640px) {
      .container, .container-md { padding: 0 24px; }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 600;
      font-size: 0.875rem;
      padding: 10px 18px;
      border-radius: var(--radius-md);
      transition: all 0.18s ease;
      white-space: nowrap;
      user-select: none;
    }

    .btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      pointer-events: none;
    }

    .btn-lg {
      padding: 13px 24px;
      font-size: 0.95rem;
    }

    .btn-sm {
      padding: 8px 14px;
      font-size: 0.82rem;
    }

    .btn-full {
      width: 100%;
    }

    .btn-primary {
      background: var(--orange);
      color: #fff;
      box-shadow: 0 4px 12px rgba(255, 122, 26, 0.28);
    }

    .btn-primary:hover { background: var(--orange-hover); }

    .btn-navy {
      background: var(--navy);
      color: #fff;
    }

    .btn-navy:hover { background: var(--navy-dark); }

    .btn-outline {
      border: 1px solid rgba(15, 76, 129, 0.25);
      color: var(--navy);
      background: #fff;
    }

    .btn-outline:hover { background: var(--navy-soft); }

    .btn-danger {
      background: var(--danger);
      color: #fff;
    }

    .btn-danger:hover { background: #B91C1C; }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .badge-orange { background: var(--orange-soft); color: #D95B00; }
    .badge-navy { background: var(--navy-soft); color: var(--navy); }
    .badge-green { background: var(--success-soft); color: var(--success); }
    .badge-gray { background: #F1F5F9; color: var(--muted); }
    .badge-red { background: var(--danger-soft); color: var(--danger); }

    /* Form Controls */
    .field-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 6px;
    }

    .field-label-muted {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 12px;
      color: var(--muted);
      pointer-events: none;
      display: flex;
    }

    .input {
      width: 100%;
      padding: 11px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--bg);
      font-size: 0.875rem;
      color: var(--ink);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }

    .input-with-icon {
      padding-left: 38px;
    }

    .input:focus {
      border-color: var(--navy);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(15, 76, 129, 0.14);
    }

    .input:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    /* =========================================================================
     * 3. HEADER & NAVIGATION
     * ========================================================================= */
    .header {
      position: sticky;
      top: 0;
      z-index: 60;
      transition: background 0.25s, box-shadow 0.25s;
    }

    .header-navy {
      background: var(--navy);
      color: #fff;
    }

    .header-white {
      background: #fff;
      color: var(--ink);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    .header-inner {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand-btn {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-badge {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: var(--orange);
      color: #fff;
      font-weight: 900;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }

    .brand-text {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .header-white .brand-text { color: var(--navy); }
    .header-navy .brand-text { color: #fff; }

    .nav-links {
      display: none;
      align-items: center;
      gap: 4px;
    }

    .nav-actions {
      display: none;
      align-items: center;
      gap: 10px;
    }

    .nav-link {
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.875rem;
      font-weight: 600;
      transition: background 0.15s, color 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .header-navy .nav-link { color: rgba(255, 255, 255, 0.85); }
    .header-navy .nav-link:hover { color: #fff; background: rgba(255, 255, 255, 0.12); }

    .header-white .nav-link { color: var(--muted); }
    .header-white .nav-link:hover { color: var(--navy); background: var(--navy-soft); }

    .mobile-menu-btn {
      display: inline-flex;
      padding: 8px;
      border-radius: 10px;
    }

    .header-navy .mobile-menu-btn { color: #fff; }
    .header-white .mobile-menu-btn { color: var(--ink); }

    .mobile-drawer {
      background: #fff;
      color: var(--ink);
      border-top: 1px solid var(--border);
      padding: 12px 16px 20px;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .mobile-drawer-link {
      text-align: left;
      padding: 12px 14px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mobile-drawer-link:hover { background: var(--bg); }

    @media (min-width: 768px) {
      .nav-links, .nav-actions { display: flex; }
      .mobile-menu-btn, .mobile-drawer { display: none !important; }
    }

    /* =========================================================================
     * 4. HERO & FLOATING SEARCH CARD (HOME)
     * ========================================================================= */
    .hero {
      background: linear-gradient(135deg, #0A3A64 0%, #0F4C81 55%, #165D9A 100%);
      color: #fff;
      position: relative;
      overflow: hidden;
      padding: 44px 0 110px;
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 26px 26px;
      pointer-events: none;
    }

    .hero-grid {
      position: relative;
      display: grid;
      grid-template-columns: 1fr;
      gap: 32px;
      align-items: center;
    }

    @media (min-width: 1024px) {
      .hero { padding: 54px 0 124px; }
      .hero-grid { grid-template-columns: 1.02fr 0.98fr; }
    }

    .hero-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--orange);
      animation: pulseAnim 1.8s infinite;
    }

    .hero-title {
      font-size: 2.15rem;
      font-weight: 800;
      line-height: 1.16;
      margin-bottom: 14px;
      letter-spacing: -0.02em;
    }

    @media (min-width: 640px) {
      .hero-title { font-size: 2.85rem; }
    }

    .hero-desc {
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.82);
      max-width: 540px;
      margin-bottom: 28px;
      line-height: 1.6;
    }

    .hero-stats {
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
    }

    .hero-stat-val {
      font-size: 1.45rem;
      font-weight: 800;
      line-height: 1.2;
    }

    .hero-stat-lbl {
      font-size: 0.76rem;
      color: rgba(255, 255, 255, 0.68);
      font-weight: 500;
    }

    .hero-stat-div {
      width: 1px;
      height: 30px;
      background: rgba(255, 255, 255, 0.2);
    }

    .hero-art {
      display: none;
    }

    @media (min-width: 1024px) {
      .hero-art { display: block; }
    }

    /* Search Card */
    .search-float-wrap {
      position: relative;
      z-index: 40;
      margin-top: -64px;
    }

    .search-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      padding: 20px;
    }

    .search-row {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    @media (min-width: 1024px) {
      .search-card { padding: 24px; }
      .search-row {
        flex-direction: row;
        align-items: flex-end;
      }
    }

    .search-cities {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1.35;
    }

    @media (min-width: 640px) {
      .search-cities {
        flex-direction: row;
        align-items: flex-end;
      }
    }

    .swap-btn {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--navy);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      align-self: center;
      flex-shrink: 0;
    }

    .swap-btn:hover { background: var(--navy-soft); border-color: rgba(15, 76, 129, 0.3); }

    @media (min-width: 640px) {
      .swap-btn { align-self: flex-end; }
    }

    .search-meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      flex: 1.1;
    }

    @media (min-width: 640px) {
      .search-meta-grid {
        grid-template-columns: 1fr 1fr 0.9fr;
      }
    }

    .pax-col {
      grid-column: span 2;
    }

    @media (min-width: 640px) {
      .pax-col { grid-column: span 1; }
    }

    .search-box-btn {
      width: 100%;
      height: 44px;
      padding: 0 12px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      text-align: left;
      transition: border-color 0.15s;
    }

    .search-box-btn:hover { border-color: rgba(15, 76, 129, 0.45); }

    .search-box-val {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--ink);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .date-input-box {
      height: 44px;
      padding: 0 10px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--bg);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .date-input-box input {
      width: 100%;
      min-width: 0;
      border: none;
      background: transparent;
      font-size: 0.84rem;
      font-weight: 600;
      outline: none;
    }

    .pax-box {
      height: 44px;
      padding: 0 10px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .pax-step-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .pax-step-btn:hover { background: var(--navy-soft); color: var(--navy); }

    /* City Dropdown */
    .city-picker {
      position: relative;
      flex: 1;
      min-width: 0;
    }

    .city-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: 100%;
      min-width: 270px;
      max-width: 340px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      z-index: 80;
      overflow: hidden;
      animation: fadeSlide 0.16s ease;
    }

    .city-dropdown-search {
      padding: 10px;
      border-bottom: 1px solid var(--border);
      background: #fff;
    }

    .city-dropdown-list {
      max-height: 260px;
      overflow-y: auto;
    }

    .city-group-hdr {
      padding: 7px 14px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      background: var(--bg);
      position: sticky;
      top: 0;
    }

    .city-opt {
      width: 100%;
      text-align: left;
      padding: 10px 14px;
      font-size: 0.87rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid #F8FAFC;
      transition: background 0.12s;
    }

    .city-opt:hover { background: var(--bg); }
    .city-opt.active { background: var(--navy-soft); color: var(--navy); font-weight: 700; }

    /* =========================================================================
     * 5. HOME SECTIONS
     * ========================================================================= */
    .section {
      padding: 56px 0;
    }

    .section-white {
      background: #fff;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .section-hdr {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 28px;
    }

    .section-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -0.015em;
    }

    .section-sub {
      font-size: 0.9rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    @media (min-width: 640px) {
      .grid-3 { grid-template-columns: repeat(2, 1fr); }
      .grid-4 { grid-template-columns: repeat(2, 1fr); }
    }

    @media (min-width: 1024px) {
      .grid-3 { grid-template-columns: repeat(3, 1fr); }
      .grid-4 { grid-template-columns: repeat(4, 1fr); }
    }

    /* Popular Route Cards */
    .route-card {
      position: relative;
      height: 196px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      text-align: left;
      width: 100%;
      display: block;
      transition: transform 0.22s ease, box-shadow 0.22s ease;
    }

    .route-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
    }

    .route-bg-svg, .route-bg-img-wrap {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .route-bg-svg svg, .route-bg-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease, opacity 0.45s ease;
    }

    .route-card:hover .route-bg-svg svg,
    .route-card:hover .route-bg-img {
      transform: scale(1.06);
    }

    .route-bg-img { opacity: 0; }
    .route-bg-img.loaded { opacity: 1; }

    .route-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(15, 76, 129, 0.08) 0%, rgba(15, 76, 129, 0.32) 48%, rgba(10, 42, 74, 0.92) 100%);
    }

    .route-tag {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 2;
    }

    .route-info {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 14px;
      z-index: 2;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
    }

    .route-name {
      color: rgba(255, 255, 255, 0.96);
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 3px;
    }

    .route-dur {
      color: #fff;
      font-size: 0.86rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .route-price-lbl {
      color: rgba(255, 255, 255, 0.78);
      font-size: 0.7rem;
      text-align: right;
    }

    .route-price {
      color: #FF9447;
      font-size: 1.2rem;
      font-weight: 800;
      line-height: 1.1;
      text-align: right;
    }

    /* Feature Cards */
    .feature-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
    }

    .feature-icon {
      width: 48px;
      height: 48px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    /* Promo Cards */
    .promo-card {
      border-radius: var(--radius-lg);
      padding: 24px;
      color: #fff;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-md);
    }

    .promo-circle-1 {
      position: absolute;
      right: -24px;
      top: -24px;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
    }

    .promo-circle-2 {
      position: absolute;
      right: -10px;
      bottom: -36px;
      width: 126px;
      height: 126px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.07);
    }

    .promo-code-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #fff;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-weight: 700;
      font-size: 0.86rem;
      letter-spacing: 0.08em;
      transition: background 0.15s;
    }

    .promo-code-btn:hover { background: rgba(255, 255, 255, 0.3); }

      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;

    function formatDateEN(isoDate) {
      if (!isoDate) return 'Tomorrow';
      const parts = isoDate.split('-');
      if (parts.length !== 3) return isoDate;
      const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      return `${days[d.getDay()]}, ${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');

      const mins = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');

      return `${hrs}:${mins}:${secs}`;

    // Crisp deterministic QR Code SVG
    function renderQrSvg(code, size = 112) {
      let cells = '';
      const seed = (code || 'HC-VN-00000').split('').reduce((a, c) => a + c.charCodeAt(0), 0);
      for (let r = 0; r < 11; r++) {
        for (let c = 0; c < 11; c++) {
          const inCorner = (r < 3 && c < 3) || (r < 3 && c > 7) || (r > 7 && c < 3);
          if (inCorner) continue;
          if (((r * 13 + c * 7 + seed) % 3) === 0 || ((r + c + seed) % 5) === 0) {
            cells += `<rect x="${12 + c * 8}" y="${12 + r * 8}" width="6.5" height="6.5" rx="1" fill="#0F4C81"/>`;
          }
        }
      }
      return `
        <svg width="${size}" height="${size}" viewBox="0 0 112 112" xmlns="http://www.w3.org/2000/svg" style="background:#fff;border-radius:10px;">
          <rect x="10" y="10" width="24" height="24" rx="4" fill="none" stroke="#0F4C81" stroke-width="4"/>
          <rect x="17" y="17" width="10" height="10" rx="2" fill="#0F4C81"/>
          <rect x="78" y="10" width="24" height="24" rx="4" fill="none" stroke="#0F4C81" stroke-width="4"/>
          <rect x="85" y="17" width="10" height="10" rx="2" fill="#0F4C81"/>
          <rect x="10" y="78" width="24" height="24" rx="4" fill="none" stroke="#0F4C81" stroke-width="4"/>
          <rect x="17" y="85" width="10" height="10" rx="2" fill="#0F4C81"/>
          ${cells}
        </svg>
      `;
    }

    /**
     * Batched Wikipedia Action API helper.
     * Properly resolves both `normalized` and `redirects` chains so every requested
     * title maps reliably to its page thumbnail URL.
     */
    async function fetchWikiBatch(lang, titles) {
      if (!titles || !titles.length) return {};
      const url = `https://${lang}.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(titles.join('|'))}&prop=pageimages&pithumbsize=800&redirects=1&origin=*&format=json`;
      try {
        const res = await fetch(url, { headers: { Accept: 'application/json' } });
        if (!res.ok) return {};
        const data = await res.json();
        const query = data && data.query;
        if (!query || !query.pages) return {};

        const normMap = {};
        (query.normalized || []).forEach(n => { normMap[n.from] = n.to; });

        const redirMap = {};
        (query.redirects || []).forEach(r => { redirMap[r.from] = r.to; });

        const pageThumbByTitle = {};
        const pageThumbByLower = {};
        Object.values(query.pages).forEach(page => {
          if (page && page.title && page.thumbnail && page.thumbnail.source) {
            pageThumbByTitle[page.title] = page.thumbnail.source;
            pageThumbByLower[page.title.toLowerCase()] = page.thumbnail.source;
          }
        });

        const result = {};
        titles.forEach(orig => {
          let cur = normMap[orig] || orig.replace(/_/g, ' ');
          for (let i = 0; i < 6 && redirMap[cur]; i++) {
            cur = redirMap[cur];
          }
          const found = pageThumbByTitle[cur] || pageThumbByLower[cur.toLowerCase()];
          if (found) result[orig] = found;
        });
        return result;
      } catch (err) {
        return {};
      }
    }

    /**
     * Fetches all 6 Vietnam destination photos in ONE batched EN Wikipedia query,
     * with batched VI Wikipedia and alternate landmark fallbacks for any missing items.
     */
    async function loadDestinationPhotos() {
      // 1. Primary batched query (English Wikipedia)
      const enTitles = POPULAR_ROUTES.map(r => r.enTitle);
      const enMap = await fetchWikiBatch('en', enTitles);
      POPULAR_ROUTES.forEach(r => {
        if (enMap[r.enTitle]) routeImageCache[r.slug] = enMap[r.enTitle];
      });

      // 2. Secondary batched fallback (Vietnamese Wikipedia) for any missing routes
      const missingAfterEn = POPULAR_ROUTES.filter(r => !routeImageCache[r.slug]);
      if (missingAfterEn.length) {
        const viMap = await fetchWikiBatch('vi', missingAfterEn.map(r => r.viTitle));
        missingAfterEn.forEach(r => {
          if (viMap[r.viTitle]) routeImageCache[r.slug] = viMap[r.viTitle];
        });
      }

      // 3. Tertiary batched fallback (Alternate landmark titles) for any still-missing routes
      const missingAfterVi = POPULAR_ROUTES.filter(r => !routeImageCache[r.slug]);
      if (missingAfterVi.length) {
        const altMap = await fetchWikiBatch('en', missingAfterVi.map(r => r.altTitle));
        missingAfterVi.forEach(r => {
          if (altMap[r.altTitle]) routeImageCache[r.slug] = altMap[r.altTitle];
        });
      }

      // Stagger image src assignments slightly (80ms apart) to avoid Wikimedia CDN throttling
      POPULAR_ROUTES.forEach((route, idx) => {
        const imgUrl = routeImageCache[route.slug];
        if (imgUrl) {
          setTimeout(() => {
            injectRoutePhoto(route.slug, imgUrl, `${route.from} to ${route.to}`, 0);
          }, idx * 80);
        }
      });
    }

    /**
     * On-demand fallback when a resolved <img> still triggers onerror after a retry.
     */
    async function fetchSingleRouteFallback(slug) {
      const route = POPULAR_ROUTES.find(r => r.slug === slug);
      if (!route) return;
      const tried = routeFallbackTried[slug] || 0;
      routeFallbackTried[slug] = tried + 1;

      let nextUrl = null;
      if (tried === 0) {
        const viMap = await fetchWikiBatch('vi', [route.viTitle]);
        if (viMap[route.viTitle] && viMap[route.viTitle] !== routeImageCache[slug]) {
          nextUrl = viMap[route.viTitle];
        }
      }
      if (!nextUrl && tried <= 1) {
        const altMap = await fetchWikiBatch('en', [route.altTitle]);
        if (altMap[route.altTitle] && altMap[route.altTitle] !== routeImageCache[slug]) {
          nextUrl = altMap[route.altTitle];
        }
      }

      if (nextUrl) {
        routeImageCache[slug] = nextUrl;
        injectRoutePhoto(slug, nextUrl, `${route.from} to ${route.to}`, 0);
      }
    }

    function handleRouteImgLoad(imgEl, slug) {
      if (imgEl && imgEl.complete && imgEl.naturalWidth > 0) {
        routeImageLoaded[slug] = true;
        imgEl.classList.add('loaded');
      }
    }

    function handleRouteImgError(imgEl, slug, attempt) {
      const currentAttempt = Number(attempt || 0);
      const url = routeImageCache[slug];
      if (currentAttempt === 0 && url) {
        setTimeout(() => {
          injectRoutePhoto(slug, url, imgEl ? imgEl.alt : slug, 1);
        }, 700);
      } else {
        if (imgEl) imgEl.remove();
        fetchSingleRouteFallback(slug);
      }
    }

    function injectRoutePhoto(slug, imgUrl, alt, attempt = 0) {
      const slot = document.getElementById(`route-photo-${slug}`);
      if (!slot) return;
      const img = document.createElement('img');
      img.alt = alt;
      img.referrerPolicy = 'no-referrer';
      img.decoding = 'async';
      img.className = 'route-bg-img';
      img.onload = () => handleRouteImgLoad(img, slug);
      img.onerror = () => handleRouteImgError(img, slug, attempt);
      img.src = imgUrl;
      slot.innerHTML = '';
      slot.appendChild(img);
      if (img.complete && img.naturalWidth > 0) {
        handleRouteImgLoad(img, slug);
      }
    }

    /* =========================================================================
     * 6. DYNAMIC VIETNAM TRIP GENERATOR & SEAT MAP GENERATOR
     * ========================================================================= */
    function generateTrips(from, to) {
      const pickup = getStationName(from);
      const drop = getStationName(to);
      const matched = POPULAR_ROUTES.find(r => (r.from === from && r.to === to) || (r.from === to && r.to === from));

      let basePrice = 240000;
      let durMin = 300;
      if (matched) {
        basePrice = matched.fromPrice;
        const m = matched.duration.match(/(\d+)h\s*(\d+)m/);
        if (m) durMin = parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
      } else {
        const seed = (from.length * 13 + to.length * 29) % 6;
        const presets = [
          { p: 150000, d: 150 }, { p: 210000, d: 260 }, { p: 280000, d: 380 },
          { p: 340000, d: 460 }, { p: 185000, d: 210 }, { p: 410000, d: 540 }
        ];
        basePrice = presets[seed].p;
        durMin = presets[seed].d;
      }

      const fmtDur = (m) => `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, '0')}m`;
      const addMins = (hhmm, mins) => {
        const [h, m] = hhmm.split(':').map(Number);
        const tot = (h * 60 + m + mins) % (24 * 60);
        return `${String(Math.floor(tot / 60)).padStart(2, '0')}:${String(tot % 60).padStart(2, '0')}`;
      };
      const round10k = (v) => Math.max(100000, Math.min(780000, Math.round(v / 10000) * 10000));

      return [
        {
          id: 'vn-1', operator: 'Phuong Trang Express', initials: 'PT', color: '#FF7A1A',
          rating: 4.8, reviews: 3420, departureTime: '06:30', arrivalTime: addMins('06:30', durMin),
          duration: fmtDur(durMin), busType: 'Sleeper', pickupStation: pickup, dropStation: drop,
          seatsLeft: 11, amenities: ['wifi', 'power'], price: round10k(basePrice), hasUpperDeck: true
        },
        {
          id: 'vn-2', operator: 'Sao Viet Limousine', initials: 'SV', color: '#0F4C81',
          rating: 4.9, reviews: 2185, departureTime: '08:00', arrivalTime: addMins('08:00', Math.max(90, durMin - 20)),
          duration: fmtDur(Math.max(90, durMin - 20)), busType: 'VIP Limousine', pickupStation: pickup, dropStation: drop,
          seatsLeft: 4, amenities: ['wifi', 'power', 'restroom', 'legroom', 'coffee'], price: round10k(basePrice * 1.45), hasUpperDeck: true
        },
        {
          id: 'vn-3', operator: 'Hoang Long Coach', initials: 'HL', color: '#059669',
          rating: 4.6, reviews: 1640, departureTime: '11:30', arrivalTime: addMins('11:30', durMin + 15),
          duration: fmtDur(durMin + 15), busType: 'Seater', pickupStation: pickup, dropStation: drop,
          seatsLeft: 16, amenities: ['wifi'], price: round10k(basePrice * 0.8), hasUpperDeck: false
        },
        {
          id: 'vn-4', operator: 'Thanh Buoi Lines', initials: 'TB', color: '#6366F1',
          rating: 4.7, reviews: 2890, departureTime: '14:15', arrivalTime: addMins('14:15', durMin),
          duration: fmtDur(durMin), busType: 'Sleeper', pickupStation: pickup, dropStation: drop,
          seatsLeft: 3, amenities: ['wifi', 'power', 'restroom'], price: round10k(basePrice * 1.1), hasUpperDeck: true
        },
        {
          id: 'vn-5', operator: 'Hai Van Express', initials: 'HV', color: '#D97706',
          rating: 4.8, reviews: 1290, departureTime: '21:00', arrivalTime: addMins('21:00', Math.max(90, durMin - 10)),
          duration: fmtDur(Math.max(90, durMin - 10)), busType: 'VIP Limousine', pickupStation: pickup, dropStation: drop,
          seatsLeft: 7, amenities: ['wifi', 'power', 'restroom', 'legroom', 'coffee'], price: round10k(basePrice * 1.35), hasUpperDeck: true
        }
      ];
    }

    function generateSeats(deck) {
      const bookedLower = new Set(['1A', '1B', '3C', '4B', '5D', '6A', '7B', '8C', '9A', '9D', '10C', '11B']);
      const bookedUpper = new Set(['2A', '2B', '4C', '5D', '6B', '7A', '8C', '10A']);
      const legLower = new Set([1, 6]);
      const legUpper = new Set([1, 5]);
      const booked = deck === 'lower' ? bookedLower : bookedUpper;
      const leg = deck === 'lower' ? legLower : legUpper;
      const res = [];
      for (let r = 1; r <= 11; r++) {
        for (const c of ['A', 'B', 'C', 'D']) {
          const id = `${r}${c}`;
          res.push({ id, row: r, col: c, status: booked.has(id) ? 'booked' : leg.has(r) ? 'legroom' : 'available' });
        }
      }
      return res;
    }

    /* =========================================================================
     * 10. SCREEN 2: SEARCH RESULTS (60FPS MAX PRICE SLIDER)

    let priceSliderRafId = null;
    let lastRenderedTripKey = '';

    function getFilteredTrips() {
      return state.trips
        .filter(t => state.filterBusTypes.length === 0 || state.filterBusTypes.includes(t.busType))
        .filter(t => t.price <= state.filterMaxPrice)
        .filter(t => state.filterAmenities.length === 0 || state.filterAmenities.every(a => t.amenities.includes(a)))
        .sort((a, b) => {
          if (state.sortBy === 'cheapest') return a.price - b.price;
          if (state.sortBy === 'rated') return b.rating - a.rating;
          return a.departureTime.localeCompare(b.departureTime);
        });
    }

    function getPricePercent(val) {
      return Math.max(0, Math.min(100, ((val - 100000) / (800000 - 100000)) * 100));
    }

    function renderFiltersHtml() {
      const busTypes = ['Seater', 'Sleeper', 'VIP Limousine'];
      const pct = getPricePercent(state.filterMaxPrice);
      const hasActiveFilter = state.filterBusTypes.length > 0 || state.filterAmenities.length > 0 || state.filterMaxPrice < 800000;

      return `
        <div class="card p-5 flex flex-col gap-4">
          <div>
            <h3 class="font-bold text-sm mb-3">Bus type</h3>
            <div class="flex flex-col gap-2">
              ${busTypes.map(bt => {
                const chk = state.filterBusTypes.includes(bt);
                return `
                  <div class="check-row" onclick="toggleBusType('${bt}')">
                    <span class="check-box ${chk ? 'checked' : ''}">${chk ? icon('check', 11) : ''}</span>
                    <span>${bt}</span>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <div style="border-top:1px solid var(--border);padding-top:16px;">
            <div class="flex items-center justify-between mb-2">
              <h3 class="font-bold text-sm">Max price</h3>
              <strong class="text-sm text-orange js-max-price-value">${formatVND(state.filterMaxPrice)}</strong>
            </div>
            <input
              type="range"
              class="price-slider"
              min="100000"
              max="800000"
              step="5000"
              value="${state.filterMaxPrice}"
              style="--val:${pct}%"
              aria-label="Max price"
              oninput="onPriceSliderInput(this)"
            />
            <div class="flex justify-between text-xs text-muted mt-2">
              <span>100,000₫</span><span>800,000₫</span>
            </div>
          </div>

          <div style="border-top:1px solid var(--border);padding-top:16px;">
            <h3 class="font-bold text-sm mb-3">Amenities</h3>
            <div class="flex flex-col gap-2">
              ${Object.keys(AMENITIES).map(k => {
                const chk = state.filterAmenities.includes(k);
                return `
                  <div class="check-row" onclick="toggleAmenity('${k}')">
                    <span class="check-box ${chk ? 'checked' : ''}">${chk ? icon('check', 11) : ''}</span>
                    <span class="flex items-center gap-2"><span class="text-muted">${icon(AMENITIES[k].icon, 13)}</span> ${AMENITIES[k].label}</span>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <button type="button" class="btn btn-outline btn-sm btn-full js-reset-filter-btn" style="display:${hasActiveFilter ? 'inline-flex' : 'none'};" onclick="resetFilters()">
            Reset filters
          </button>
        </div>
      `;
    }

    function renderTripListHtml(list) {
      const badgeCls = { 'Seater': 'badge-gray', 'Sleeper': 'badge-navy', 'VIP Limousine': 'badge-orange' };

      if (list.length === 0) {
        return `
          <div class="card p-6" style="text-align:center;padding:56px 20px;">
            <div class="text-muted mb-3">${icon('alertCircle', 40)}</div>
            <h3 class="font-bold mb-2">No trips found</h3>
            <p class="text-sm text-muted mb-4">Try adjusting your max price slider or bus type filters.</p>
            <button type="button" class="btn btn-navy" onclick="resetFilters()">Clear filters</button>

        `;

      return list.map(t => {
        const exp = state.expandedTripIds.has(t.id);
        return `
          <div class="card">
            <div class="p-5">

                  <div style="text-align:center;">
                    <div class="text-xs text-muted">${t.duration}</div>
                    <div class="flex items-center gap-2" style="gap:4px;margin-top:4px;">
                      <span style="width:7px;height:7px;border-radius:50%;border:2px solid var(--navy);"></span>
                      <span style="width:46px;height:2px;background:rgba(15,76,129,0.28);"></span>

                  <div style="text-align:center;">
                    <div style="font-size:1.2rem;font-weight:800;">${t.arrivalTime}</div>
                    <div class="text-xs text-muted truncate" style="max-width:118px;">${escapeHtml(t.dropStation)}</div>
                  </div>
                </div>

                <div class="flex items-center justify-between gap-4" style="justify-content:flex-end;">
                  <div style="text-align:right;">
                    <div class="text-xs font-bold ${t.seatsLeft <= 5 ? 'text-danger' : 'text-success'}">${t.seatsLeft <= 5 ? `Only ${t.seatsLeft} seats left` : `${t.seatsLeft} seats left`}</div>
                    <div style="font-size:1.35rem;font-weight:800;color:var(--orange);">${formatVND(t.price)}</div>
                    <div class="text-xs text-muted">per person</div>

                <div class="flex gap-2" style="flex-wrap:wrap;">
                  ${t.amenities.map(k => AMENITIES[k] ? `<span class="text-xs text-muted" style="background:var(--bg);padding:4px 9px;border-radius:8px;display:inline-flex;align-items:center;gap:5px;">${icon(AMENITIES[k].icon, 12)} ${AMENITIES[k].label}</span>` : '').join('')}
                </div>
                <button type="button" class="text-xs font-bold text-navy flex items-center gap-2" style="gap:4px;" onclick="toggleTripExpand('${t.id}')">
                  ${exp ? 'Less details' : 'More details'} ${icon(exp ? 'chevronUp' : 'chevronDown', 14)}
                </button>
              </div>
            </div>

            ${exp ? `
              <div style="border-top:1px solid var(--border);background:var(--bg);padding:18px 20px;border-radius:0 0 16px 16px;" class="grid-3 text-sm">
                <div>
                  <div class="font-bold mb-2">Pickup point</div>
                  <div class="text-muted flex items-center gap-2">${icon('mapPin', 14)} ${escapeHtml(t.pickupStation)}</div>
                </div>
                <div>
                  <div class="font-bold mb-2">Drop-off point</div>
                  <div class="text-muted flex items-center gap-2">${icon('mapPin', 14)} ${escapeHtml(t.dropStation)}</div>
                </div>
                <div>
                  <div class="font-bold mb-2">Cancellation policy</div>
                  <div class="text-muted">Free cancellation up to 24h before departure. 50% refund within 24h.</div>
                </div>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    function onPriceSliderInput(el) {
      const val = Number(el.value);
      state.filterMaxPrice = val;
      const pct = getPricePercent(val);
      const formatted = formatVND(val);
      const hasActiveFilter = state.filterBusTypes.length > 0 || state.filterAmenities.length > 0 || val < 800000;

      // Update slider track fill & price labels directly without re-rendering sidebar
      el.style.setProperty('--val', pct + '%');
      document.querySelectorAll('.price-slider').forEach(slider => {
        if (slider !== el) {
          slider.value = val;
          slider.style.setProperty('--val', pct + '%');
        }
      });
      document.querySelectorAll('.js-max-price-value').forEach(lbl => {
        lbl.textContent = formatted;
      });
      document.querySelectorAll('.js-reset-filter-btn').forEach(btn => {
        btn.style.display = hasActiveFilter ? 'inline-flex' : 'none';
      });

      // Only patch trip results container via requestAnimationFrame when matched list changes
      if (priceSliderRafId) cancelAnimationFrame(priceSliderRafId);
      priceSliderRafId = requestAnimationFrame(() => {
        const list = getFilteredTrips();
        const key = list.map(t => t.id).join(',');
        if (key === lastRenderedTripKey) return;
        lastRenderedTripKey = key;

        const listEl = document.getElementById('trip-results-list');
        if (listEl) listEl.innerHTML = renderTripListHtml(list);

        const countEl = document.getElementById('trip-count-text');
        if (countEl) countEl.textContent = list.length;

        const wordEl = document.getElementById('trip-count-word');
        if (wordEl) wordEl.textContent = list.length === 1 ? 'trip' : 'trips';

        document.querySelectorAll('.js-mobile-filter-count').forEach(span => {
          span.textContent = list.length;
        });
      });
    }

    function renderSearchScreen() {
      const list = getFilteredTrips();
      lastRenderedTripKey = list.map(t => t.id).join(',');

      return `
        <div class="sub-bar">
          <div class="container sub-bar-inner">
            <button type="button" style="padding:8px;border-radius:10px;color:var(--muted);" onclick="navigate('home')">${icon('arrowLeft', 18)}</button>
            <div class="flex items-center gap-2 font-bold">
              <span>${escapeHtml(state.query.from)}</span>
              <span class="text-orange">${icon('arrowRight', 15)}</span>
              <span>${escapeHtml(state.query.to)}</span>
            </div>
            <span class="text-sm text-muted">· ${formatDateEN(state.query.date)} · ${state.query.passengers} passenger${state.query.passengers > 1 ? 's' : ''}</span>
            <div style="margin-left:auto;" class="flex items-center gap-3">
              <span class="text-sm text-muted"><strong id="trip-count-text" style="color:var(--ink);">${list.length}</strong> <span id="trip-count-word">${list.length === 1 ? 'trip' : 'trips'}</span> found</span>
              <button type="button" class="btn btn-navy btn-sm mobile-filter-btn" onclick="state.mobileFilterOpen=true; render();">${icon('filter', 13)} Filter</button>
            </div>
          </div>
        </div>

        <div class="container search-layout">
          <aside class="filter-sidebar">
            <div class="flex items-center gap-2 font-bold text-sm mb-3">${icon('sliders', 15)} Filters</div>
            ${renderFiltersHtml()}
          </aside>

          <div class="results-col">
            <div class="sort-bar">
              ${[['cheapest', 'Cheapest'], ['earliest', 'Earliest'], ['rated', 'Highest rated']].map(([k, lbl]) => `
                <button type="button" class="sort-pill ${state.sortBy === k ? 'active' : ''}" onclick="state.sortBy='${k}'; render();">${lbl}</button>
              `).join('')}
            </div>

            <div id="trip-results-list" class="flex flex-col gap-4">
              ${renderTripListHtml(list)}
            </div>
          </div>
        </div>

        ${state.mobileFilterOpen ? `
          <div class="modal-backdrop" onclick="state.mobileFilterOpen=false; render();">
            <div class="modal-box" onclick="event.stopPropagation()">
              <div class="flex items-center justify-between mb-4">
                <h3 class="font-bold">Filters</h3>
                <button type="button" onclick="state.mobileFilterOpen=false; render();">${icon('x', 18)}</button>
              </div>
              ${renderFiltersHtml()}

    /* =========================================================================
     * 11. SCREEN 3: SEAT SELECTION
     * ========================================================================= */
    function renderSeatScreen() {
      const trip = state.selectedTrip;
      if (!trip) return '';
      const pax = state.query.passengers;
      const seats = generateSeats(state.activeDeck);
      const total = trip.price * state.selectedSeats.length;

      const seatBtn = (s) => {
        const code = `${state.activeDeck === 'upper' ? 'U' : ''}${s.id}`;
        const sel = state.selectedSeats.includes(code);
        const cls = s.status === 'booked' ? 'booked' : sel ? 'selected' : s.status === 'legroom' ? 'legroom' : '';
        return `<button type="button" class="seat-btn ${cls}" ${s.status === 'booked' ? 'disabled' : `onclick="toggleSeat('${code}')"`} title="Seat ${code}">${s.col}</button>`;
      };

      const rowsHtml = Array.from({ length: 11 }, (_, i) => i + 1).map(row => {
        const rs = seats.filter(s => s.row === row);
        return `
          <div class="flex items-center gap-2 mb-2">
            <span class="text-xs text-muted font-bold" style="width:24px;text-align:right;">${row}</span>
            <div class="flex gap-2">${rs.filter(s => s.col === 'A' || s.col === 'B').map(seatBtn).join('')}</div>
            <span class="text-muted" style="width:28px;text-align:center;opacity:0.35;">│</span>
            <div class="flex gap-2">${rs.filter(s => s.col === 'C' || s.col === 'D').map(seatBtn).join('')}</div>
          </div>
        `;
      }).join('');

      return `
        <div style="background:#fff;border-bottom:1px solid var(--border);padding:14px 0;">
          <div class="container flex items-center gap-4">
            <button type="button" style="padding:8px;color:var(--muted);" onclick="navigate('search')">${icon('arrowLeft', 18)}</button>
            ${renderStepper(0)}
          </div>
        </div>

        <div class="container seat-layout">
          <div class="card p-6" style="flex:1;min-width:0;">
            <div class="flex items-center justify-between gap-3 mb-4" style="flex-wrap:wrap;">
              <div>
                <h2 class="font-extrabold" style="font-size:1.15rem;">Choose your seat${pax > 1 ? 's' : ''}</h2>
                <p class="text-xs text-muted mt-2">Select ${pax} seat${pax > 1 ? 's' : ''} for your journey</p>
              </div>
              ${trip.hasUpperDeck ? `
                <div class="deck-tabs">
                  <button type="button" class="deck-tab ${state.activeDeck === 'lower' ? 'active' : ''}" onclick="state.activeDeck='lower'; render();">Lower deck</button>
                  <button type="button" class="deck-tab ${state.activeDeck === 'upper' ? 'active' : ''}" onclick="state.activeDeck='upper'; render();">Upper deck</button>
                </div>

            <div class="flex gap-4 mb-4 text-xs text-muted" style="flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--border);">
              <span class="flex items-center gap-2"><span style="width:18px;height:18px;border-radius:5px;border:1px solid var(--border);background:#fff;display:inline-block;"></span> Available</span>
              <span class="flex items-center gap-2"><span style="width:18px;height:18px;border-radius:5px;background:var(--navy);display:inline-block;"></span> Selected</span>
              <span class="flex items-center gap-2"><span style="width:18px;height:18px;border-radius:5px;background:#F1F5F9;border:1px solid var(--border);display:inline-block;"></span> Booked</span>
              <span class="flex items-center gap-2"><span style="width:18px;height:18px;border-radius:5px;border:2px solid var(--success);background:#fff;display:inline-block;"></span> Extra legroom</span>
            </div>

            <div style="overflow-x:auto;display:flex;justify-content:center;">
              <div style="min-width:max-content;padding:6px 0;">
                <div class="flex items-center justify-between text-xs font-bold text-muted mb-3" style="background:var(--bg);padding:8px 14px;border-radius:10px;">
                  <span>Front (Driver)</span>
                  <span>${trip.hasUpperDeck ? (state.activeDeck === 'lower' ? 'Lower deck' : 'Upper deck') : 'Main cabin'}</span>
                </div>
                <div class="flex items-center gap-2 mb-2" style="margin-left:32px;">
                  <div class="flex gap-2">
                    <span class="text-xs font-bold text-muted" style="width:40px;text-align:center;">A</span>
                    <span class="text-xs font-bold text-muted" style="width:40px;text-align:center;">B</span>
                  </div>
                  <span class="text-xs text-muted" style="width:28px;text-align:center;">Aisle</span>
                  <div class="flex gap-2">
                    <span class="text-xs font-bold text-muted" style="width:40px;text-align:center;">C</span>
                    <span class="text-xs font-bold text-muted" style="width:40px;text-align:center;">D</span>
                  </div>
                </div>
                ${rowsHtml}
              </div>
            </div>
          </div>

          <div class="seat-summary-col">
            <div class="card p-6">
              <h3 class="font-bold mb-4">Booking summary</h3>
              <div class="flex items-center gap-3 mb-4" style="padding-bottom:14px;border-bottom:1px solid var(--border);">
                <div style="width:38px;height:38px;border-radius:10px;background:${trip.color};color:#fff;font-size:0.75rem;font-weight:900;display:flex;align-items:center;justify-content:center;">${trip.initials}</div>
                <div>
                  <div class="font-bold text-sm">${escapeHtml(trip.operator)}</div>
                  <div class="text-xs text-muted">${trip.departureTime} → ${trip.arrivalTime} · ${trip.busType}</div>
                </div>
              </div>

              <div class="flex flex-col gap-3 text-sm mb-4">
                <div class="flex gap-2"><span class="text-navy">${icon('mapPin', 14)}</span><div><div class="text-xs text-muted">Pick up</div><div class="font-bold">${escapeHtml(trip.pickupStation)}</div></div></div>
                <div class="flex gap-2"><span class="text-orange">${icon('mapPin', 14)}</span><div><div class="text-xs text-muted">Drop off</div><div class="font-bold">${escapeHtml(trip.dropStation)}</div></div></div>
              </div>

              <div style="background:var(--bg);border-radius:12px;padding:12px 14px;" class="mb-4">
                <div class="text-xs text-muted">Selected seats (${state.selectedSeats.length}/${pax})</div>
                <div class="font-bold text-navy mt-2">${state.selectedSeats.length ? state.selectedSeats.join(', ') : 'None selected yet'}</div>
              </div>

              <div class="flex items-center justify-between mb-4">
                <span class="text-sm text-muted">Subtotal</span>
                <span style="font-size:1.4rem;font-weight:800;color:var(--orange);">${state.selectedSeats.length ? formatVND(total) : '—'}</span>
              </div>

              <button type="button" class="btn btn-primary btn-lg btn-full" ${state.selectedSeats.length !== pax ? 'disabled' : ''} onclick="navigate('passenger')">
                Continue ${icon('arrowRight', 16)}
              </button>
            </div>
          </div>
        </div>

        <div class="mobile-sticky-bar">
          <div>
            <div class="text-xs text-muted">${state.selectedSeats.length}/${pax} seat${pax > 1 ? 's' : ''}</div>
            <div class="font-extrabold text-orange" style="font-size:1.1rem;">${state.selectedSeats.length ? formatVND(total) : '—'}</div>
          </div>
          <button type="button" class="btn btn-primary" style="flex:1;" ${state.selectedSeats.length !== pax ? 'disabled' : ''} onclick="navigate('passenger')">
            Continue ${icon('arrowRight', 15)}
          </button>
        </div>
      `;
    }

    /* =========================================================================
     * 12. SCREEN 4: PASSENGER DETAILS
     * ========================================================================= */
    function isPassengerValid() {
      const p = state.passenger;
      return p.name.trim().length >= 2 && p.email.includes('@') && p.phone.replace(/\s+/g, '').length >= 9;
    }

    function syncPassengerBtn() {
      const ok = isPassengerValid();
      document.querySelectorAll('.js-pax-next').forEach(b => { b.disabled = !ok; });
    }

    function renderPassengerScreen() {
      const trip = state.selectedTrip;
      if (!trip) return '';
      const subtotal = trip.price * state.selectedSeats.length;
      const valid = isPassengerValid();

      return `
        <div style="background:#fff;border-bottom:1px solid var(--border);padding:14px 0;">
          <div class="container-md flex items-center gap-4">
            <button type="button" style="padding:8px;color:var(--muted);" onclick="navigate('seats')">${icon('arrowLeft', 18)}</button>
            ${renderStepper(1)}
          </div>
        </div>

        <div class="container-md" style="padding-top:28px;padding-bottom:64px;display:flex;flex-direction:column;gap:20px;">
          <div class="card p-6">
            <h2 class="font-extrabold mb-4" style="font-size:1.15rem;">Passenger details</h2>
            <div class="grid-2">
              <div class="col-span-2">
                <label class="field-label">Full name</label>
                <div class="input-wrap">
                  <span class="input-icon">${icon('user', 15)}</span>
                  <input class="input input-with-icon" type="text" placeholder="e.g. Minh Anh Nguyen" value="${escapeHtml(state.passenger.name)}" oninput="state.passenger.name=this.value; syncPassengerBtn();"/>
                </div>
              </div>
              <div>
                <label class="field-label">Email address</label>
                <div class="input-wrap">
                  <span class="input-icon">${icon('mail', 15)}</span>
                  <input class="input input-with-icon" type="email" placeholder="minhanh@example.com" value="${escapeHtml(state.passenger.email)}" oninput="state.passenger.email=this.value; syncPassengerBtn();"/>
                </div>
              </div>
              <div>
                <label class="field-label">Phone number (+84)</label>
                <div class="input-wrap">
                  <span class="input-icon">${icon('phone', 15)}</span>
                  <input class="input input-with-icon" type="tel" placeholder="+84 912 345 678" value="${escapeHtml(state.passenger.phone)}" oninput="state.passenger.phone=this.value; syncPassengerBtn();"/>
                </div>
              </div>
            </div>
          </div>

          <div class="card p-6">
            <h3 class="font-bold mb-3">Trip summary</h3>
            <div class="flex items-center gap-3" style="background:var(--bg);padding:14px;border-radius:12px;">
              <div style="width:40px;height:40px;border-radius:10px;background:${trip.color};color:#fff;font-size:0.75rem;font-weight:900;display:flex;align-items:center;justify-content:center;">${trip.initials}</div>
              <div style="flex:1;min-width:0;">
                <div class="font-bold text-sm truncate">${escapeHtml(trip.operator)} (${escapeHtml(state.query.from)} → ${escapeHtml(state.query.to)})</div>
                <div class="text-xs text-muted">${formatDateEN(state.query.date)} · ${trip.departureTime} → ${trip.arrivalTime} · Seats ${state.selectedSeats.join(', ')}</div>
              </div>
              <strong class="text-orange">${formatVND(subtotal)}</strong>
            </div>
          </div>

          <div class="card p-6">
            <h3 class="font-bold mb-3">Promo code</h3>
            <div class="flex gap-2">
              <div class="input-wrap" style="flex:1;">
                <span class="input-icon">${icon('tag', 14)}</span>
                <input class="input input-with-icon" style="text-transform:uppercase;" type="text" ${state.appliedPromo ? 'disabled' : ''} placeholder="Enter code (FIRSTRIDE, WEEKEND15, DALAT50K)" value="${escapeHtml(state.passenger.promo)}" oninput="state.passenger.promo=this.value.toUpperCase()"/>
              </div>
              ${state.appliedPromo ? `
                <button type="button" class="btn" style="background:var(--success-soft);color:var(--success);" onclick="removePromo()">${icon('checkCircle', 14)} Remove</button>
              ` : `
                <button type="button" class="btn btn-outline" onclick="applyPromo()">Apply</button>
              `}
            </div>
            ${state.appliedPromo ? `<div class="text-xs font-bold text-success mt-2">✓ ${PROMO_CODES[state.appliedPromo].label}</div>` : ''}
          </div>

          <div class="flex gap-3">
            <button type="button" class="btn btn-outline btn-lg" style="flex:1;" onclick="navigate('seats')">Back</button>
            <button type="button" class="btn btn-primary btn-lg js-pax-next" style="flex:2;" ${!valid ? 'disabled' : ''} onclick="navigate('payment')">
              Continue to payment ${icon('arrowRight', 16)}
            </button>
          </div>
        </div>
      `;
    }

    /* =========================================================================
     * 13. SCREEN 5: PAYMENT
     * ========================================================================= */
    function calcTotals() {
      const base = state.selectedTrip ? state.selectedTrip.price * state.selectedSeats.length : 0;
      let discount = 0;
      if (state.appliedPromo && PROMO_CODES[state.appliedPromo]) {
        const p = PROMO_CODES[state.appliedPromo];
        discount = p.type === 'percent' ? Math.round(base * (p.value / 100)) : Math.min(base, p.value);
      }
      const after = Math.max(0, base - discount);
      const tax = Math.round(after * 0.08);
      return { base, discount, tax, total: after + tax };
    }

    function renderPaymentScreen() {
      const trip = state.selectedTrip;
      if (!trip) return '';
      const { base, discount, tax, total } = calcTotals();
      const methods = [
        { id: 'card', lbl: 'Credit / Debit card', sub: 'Visa, Mastercard, Napas', ic: 'creditCard' },
        { id: 'ewallet', lbl: 'MoMo / ZaloPay', sub: 'Instant 1-tap e-wallet', ic: 'wallet' },
        { id: 'vietqr', lbl: 'VietQR Bank Transfer', sub: 'Scan with any VN bank app', ic: 'qr' },
        { id: 'digital', lbl: 'Apple Pay / Google Pay', sub: 'Touch ID or Face ID', ic: 'smartphone' }
      ];

      return `
        <div style="background:#fff;border-bottom:1px solid var(--border);padding:14px 0;">
          <div class="container-md flex items-center gap-4">
            <button type="button" style="padding:8px;color:var(--muted);" onclick="navigate('passenger')">${icon('arrowLeft', 18)}</button>
            ${renderStepper(2)}
          </div>

          <div class="card p-6">
            <h2 class="font-extrabold mb-4" style="font-size:1.15rem;">Payment method</h2>
            <div class="pay-method-grid mb-4">
              ${methods.map(m => {
                const act = state.paymentMethod === m.id;
                return `
                  <button type="button" class="pay-method-card ${act ? 'active' : ''}" onclick="state.paymentMethod='${m.id}'; render();">
                    <span style="width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:${act ? 'var(--navy)' : 'var(--bg)'};color:${act ? '#fff' : 'var(--muted)'};">${icon(m.ic, 16)}</span>
                    <div style="flex:1;min-width:0;">
                      <div class="font-bold text-sm truncate ${act ? 'text-navy' : ''}">${m.lbl}</div>
                      <div class="text-xs text-muted truncate">${m.sub}</div>
                    </div>
                  </button>
                `;
              }).join('')}
            </div>

            ${state.paymentMethod === 'card' ? `
              <div class="grid-2" style="padding-top:14px;border-top:1px solid var(--border);">
                <div class="col-span-2">
                  <label class="field-label-muted">Cardholder name</label>
                  <input class="input" type="text" placeholder="MINH ANH NGUYEN" value="${escapeHtml(state.cardForm.name)}" oninput="state.cardForm.name=this.value"/>
                </div>
                <div class="col-span-2">
                  <label class="field-label-muted">Card number</label>
                  <input class="input" type="text" maxlength="19" placeholder="4242 4242 4242 4242" value="${escapeHtml(state.cardForm.number)}" oninput="state.cardForm.number=this.value"/>
                </div>
                <div>
                  <label class="field-label-muted">Expiry</label>
                  <input class="input" type="text" maxlength="7" placeholder="MM / YY" value="${escapeHtml(state.cardForm.expiry)}" oninput="state.cardForm.expiry=this.value"/>
                </div>
                <div>
                  <label class="field-label-muted">CVV</label>
                  <input class="input" type="password" maxlength="4" placeholder="123" value="${escapeHtml(state.cardForm.cvv)}" oninput="state.cardForm.cvv=this.value"/>
                </div>
              </div>
            ` : state.paymentMethod === 'vietqr' ? `
              <div class="flex items-center gap-4" style="background:var(--bg);padding:16px;border-radius:12px;border:1px solid var(--border);">
                ${renderQrSvg('VIETQR-' + total, 88)}
                <div>
                  <div class="font-bold text-sm mb-2">Scan VietQR for instant bank transfer</div>
                  <div class="text-xs text-muted">Amount: <strong class="text-orange">${formatVND(total)}</strong> · Supported by 40+ Vietnamese banks.</div>
                </div>
              </div>
            ` : `
              <div class="text-sm text-muted" style="background:var(--bg);padding:14px;border-radius:12px;">
                Click the button below to confirm your payment securely with <strong>${methods.find(x => x.id === state.paymentMethod).lbl}</strong>.
              </div>
            `}
          </div>

          <div class="card p-6">
            <h3 class="font-bold mb-4">Price breakdown</h3>
            <div class="flex flex-col gap-3 text-sm">
              <div class="flex justify-between"><span class="text-muted">Base fare × ${state.selectedSeats.length} seat${state.selectedSeats.length > 1 ? 's' : ''} (${state.selectedSeats.join(', ')})</span><strong>${formatVND(base)}</strong></div>
              ${discount > 0 ? `<div class="flex justify-between text-success font-bold"><span>Promo (${state.appliedPromo})</span><span>-${formatVND(discount)}</span></div>` : ''}
              <div class="flex justify-between"><span class="text-muted">VAT & service fees (8%)</span><strong>${formatVND(tax)}</strong></div>
              <div class="flex justify-between" style="padding-top:12px;border-top:1px solid var(--border);font-size:1.1rem;font-weight:800;">
                <span>Total</span>
                <span class="text-orange">${formatVND(total)}</span>
              </div>
            </div>
          </div>

          <div class="card p-5">
            <div class="check-row" style="align-items:flex-start;" onclick="state.agreedTerms=!state.agreedTerms; render();">
              <span class="check-box ${state.agreedTerms ? 'checked' : ''}" style="margin-top:2px;">${state.agreedTerms ? icon('check', 11) : ''}</span>
              <span class="text-sm text-muted">I agree to H Coach Vietnam's <strong class="text-navy">Terms of Service</strong> & <strong class="text-navy">Privacy Policy</strong> and confirm the passenger details are accurate.</span>
            </div>
          </div>

          <div>
            <button type="button" class="btn btn-primary btn-lg btn-full" ${!state.agreedTerms || state.isProcessingPayment ? 'disabled' : ''} onclick="processPayment()">
              ${state.isProcessingPayment ? `<span class="spinner"></span> Processing payment…` : `${icon('lock', 16)} Pay ${formatVND(total)} securely`}
            </button>
            <p class="text-xs text-muted mt-2" style="text-align:center;">${icon('shield', 12)} 256-bit SSL encryption · PCI DSS compliant</p>
          </div>
        </div>
      `;
    }

     * 14. SCREEN 6: BOOKING CONFIRMATION
     * ========================================================================= */
